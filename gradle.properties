# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE will override any settings specified in this file.
# For more details on Gradle settings in Android Studio, see
# https://docs.gradle.org/8.10.2/userguide/android_projects.html#system_properties
# https://docs.gradle.org/8.10.2/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr
# When configured, Gradle will run in daemon mode.
# For more details, see https://docs.gradle.org/8.10.2/userguide/gradle_daemon.html#sec:gradle_daemon
gradle.daemon=true
# When configured, Gradle will run in parallel on projects that have been declared as independent.
# For more details, see https://docs.gradle.org/8.10.2/userguide/multi_project_builds.html#sec:parallel_execution
gradle.parallel=true
# Configure this to true if you wish to use the experimental configuration cache.
# For more details, see https://docs.gradle.org/8.10.2/userguide/configuration_cache.html#configuration_cache
# org.gradle.configuration-cache=true
org.gradle.warning.mode=all
android.useAndroidX=true